        - BearerAuth: []
      responses:
        "200":
          description: Batching config
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [admin]
      summary: Update neighborhood batching configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                radiusM:
                  type: integer
                  example: 500
                maxParticipants:
                  type: integer
                  example: 10
                discountPct:
                  type: number
                  example: 25
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
