        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /admin/analytics/overview:
    get:
      tags: [admin]
      summary: Platform overview analytics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalJobs:
                    type: integer
                  completedJobs:
                    type: integer
                  activeHaulers:
                    type: integer
                  totalRevenue:
                    type: number
                  landfillDiversionPct:
                    type: number
                  co2SavedKg:
                    type: number

  /admin/disputes:
    get:
      tags: [admin]
      summary: List open disputes
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /admin/disputes/{disputeId}/resolve:
    post:
      tags: [admin]
      summary: Resolve a dispute
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: disputeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, refundAmount]
              properties:
                resolution:
                  type: string
                  enum: [refund_full, refund_partial, no_refund]
                refundAmount:
                  type: number
                notes:
                  type: string
      responses:
        "200":
          description: Dispute resolved
          content:
            application/json:
              schema:
                type: object

  /admin/batching/config:
    get:
      tags: [admin]
      summary: Get neighborhood batching configuration
