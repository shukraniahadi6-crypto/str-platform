          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    iconUrl:
                      type: string
                    earnedAt:
                      type: string
                      format: date-time

  # ── Admin ───────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [admin]
      summary: List all users (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserProfile"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "403":
          description: Forbidden
