version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: str_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: str_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U str_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
